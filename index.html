<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מעבד תעודות בטון</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --accent: #f0a500; --accent2: #e05c00; --text: #e6edf3; --muted: #8b949e;
  }
  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 2rem;
    background-image: radial-gradient(ellipse at 20% 50%, rgba(240,165,0,0.05) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 20%, rgba(224,92,0,0.05) 0%, transparent 50%);
  }
  .container { width: 100%; max-width: 780px; }
  header { text-align: center; margin-bottom: 2rem; }
  .logo { display: inline-flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
  .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
  h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 0.3rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; }
  .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 2.5rem 2rem; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(240,165,0,0.05); }
  .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
  .drop-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.3rem; }
  .drop-sub { color: var(--muted); font-size: 0.85rem; }
  .btn { width: 100%; padding: 0.9rem; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; font-family: 'Heebo', sans-serif; cursor: pointer; transition: all 0.2s; margin-top: 1.25rem; }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-secondary { background: var(--border); color: var(--text); margin-top: 0.75rem; }
  .progress-section { margin-top: 1.5rem; display: none; }
  .progress-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 1rem; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.3s; }
  .results-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 1rem; }
  .results-table th { background: rgba(240,165,0,0.15); color: var(--accent); padding: 0.6rem 0.75rem; text-align: right; font-weight: 600; border-bottom: 1px solid var(--border); }
  .results-table td { padding: 0.55rem 0.75rem; border-bottom: 1px solid rgba(48,54,61,0.5); vertical-align: middle; }
  .results-table tr:hover td { background: rgba(255,255,255,0.02); }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; }
  .status-done { background: #4ade80; }
  .status-error { background: #f87171; }
  .status-loading { background: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .empty-state { color: var(--muted); text-align: center; padding: 1.5rem; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">🏗️</div>
      <h1>תעודות בטון</h1>
    </div>
    <p class="subtitle">העלה קבצי PDF וקבל טבלת אקסל — קובץ אחד בכל פעם, בזמן אמת</p>
  </header>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" multiple accept=".pdf">
      <div class="drop-icon">📄</div>
      <div class="drop-title">גרור קבצי PDF לכאן</div>
      <div class="drop-sub">או לחץ לבחירת קבצים</div>
    </div>

    <button class="btn" id="startBtn" disabled onclick="startProcessing()">⚡ התחל עיבוד</button>
  </div>

  <div class="card" id="resultsCard" style="display:none">
    <div class="progress-section" id="progressSection">
      <div class="progress-header">
        <span id="progressText">מעבד...</span>
        <span id="progressCount">0 / 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <table class="results-table">
      <thead>
        <tr>
          <th>סטטוס</th>
          <th>קובץ</th>
          <th>מס' תעודה</th>
          <th>סוג בטון</th>
          <th>חוזק ממוצע</th>
          <th>תאריך יציקה</th>
          <th>חלק המבנה</th>
        </tr>
      </thead>
      <tbody id="resultsBody">
        <tr><td colspan="7" class="empty-state">ממתין לעיבוד...</td></tr>
      </tbody>
    </table>

    <button class="btn" id="exportBtn" style="display:none" onclick="exportExcel()">📥 הורד אקסל</button>
    <button class="btn btn-secondary" onclick="resetAll()">🔄 התחל מחדש</button>
  </div>
</div>

<script>
  const SERVER = 'https://excelproject-1rwu.onrender.com';
  let selectedFiles = [];
  let allResults = [];

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    handleFiles([...e.dataTransfer.files].filter(f => f.name.endsWith('.pdf')));
  });
  fileInput.addEventListener('change', () => handleFiles([...fileInput.files]));

  function handleFiles(files) {
    selectedFiles = files;
    document.getElementById('startBtn').disabled = files.length === 0;
    document.getElementById('startBtn').textContent = files.length > 0
      ? `⚡ עבד ${files.length} קבצים` : '⚡ התחל עיבוד';
  }

  async function startProcessing() {
    if (!selectedFiles.length) return;

    allResults = [];
    document.getElementById('resultsCard').style.display = 'block';
    document.getElementById('progressSection').style.display = 'block';
    document.getElementById('exportBtn').style.display = 'none';
    document.getElementById('startBtn').disabled = true;

    const tbody = document.getElementById('resultsBody');
    tbody.innerHTML = '';

    // צור שורה לכל קובץ מראש
    selectedFiles.forEach((f, idx) => {
      const tr = document.createElement('tr');
      tr.id = 'row-' + idx;
      tr.innerHTML = `
        <td><span class="status-dot status-loading"></span></td>
        <td>${f.name}</td>
        <td colspan="5" style="color:var(--muted)">ממתין...</td>
      `;
      tbody.appendChild(tr);
    });

    // עבד קובץ אחד בכל פעם
    for (let i = 0; i < selectedFiles.length; i++) {
      const file = selectedFiles[i];
      document.getElementById('progressText').textContent = `מעבד: ${file.name}`;
      document.getElementById('progressCount').textContent = `${i + 1} / ${selectedFiles.length}`;
      document.getElementById('progressFill').style.width = ((i / selectedFiles.length) * 100) + '%';

      const row = document.getElementById('row-' + i);

      try {
        const formData = new FormData();
        formData.append('file', file);

        const res = await fetch(SERVER + '/process-one', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        allResults.push(data);

        row.innerHTML = `
          <td><span class="status-dot status-done"></span></td>
          <td>${data['קובץ']}</td>
          <td>${data["מס' תעודה"] || '-'}</td>
          <td>${data['סוג בטון'] || '-'}</td>
          <td>${data['שיעור חוזק ממוצע'] || '-'}</td>
          <td>${data['תאריך יציקה'] || '-'}</td>
          <td>${data['חלק המבנה הנוצק'] || '-'}</td>
        `;

      } catch (err) {
        allResults.push({ "קובץ": file.name, "שגיאה": err.message });
        row.innerHTML = `
          <td><span class="status-dot status-error"></span></td>
          <td>${file.name}</td>
          <td colspan="5" style="color:#f87171">שגיאה: ${err.message}</td>
        `;
      }
    }

    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = '✅ הסתיים!';
    document.getElementById('exportBtn').style.display = 'block';
    document.getElementById('startBtn').disabled = false;
  }

  async function exportExcel() {
    const res = await fetch(SERVER + '/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(allResults)
    });
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'results_concrete_tests.xlsx';
    a.click(); URL.revokeObjectURL(url);
  }

  function resetAll() {
    selectedFiles = [];
    allResults = [];
    fileInput.value = '';
    document.getElementById('startBtn').disabled = true;
    document.getElementById('startBtn').textContent = '⚡ התחל עיבוד';
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('resultsBody').innerHTML = '';
  }
</script>
</body>
</html>
